services:
  - type: web
    name: hosting-web
    env: python
    buildCommand: pip install -r requirements.txt && (cd frontend && npm ci && npm run build)
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 hosting:app
    healthCheckPath: /api/health
    disk:
      name: hosting-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@local.host
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PERSISTENT_STORAGE
        value: "true"
